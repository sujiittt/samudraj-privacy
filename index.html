<section class="card intro" id="overview"><h2>Privacy Policy for SAMUDRAJ</h2><p><strong>SAMUDRAJ</strong> is a shopping app for devotional flowers, puja essentials and related products, including express and scheduled delivery services. This policy applies to the SAMUDRAJ app and related customer-support interactions.</p><p>In this policy, “SAMUDRAJ”, “we”, “us” and “our” refer to the SAMUDRAJ app and the business operating it.</p><div class="notice"><span class="icon">✦</span><div><strong>In simple terms:</strong> we use information to run your account, show products, manage your cart and delivery preferences, process orders and payments, provide support and protect the service.</div></div></section>
<section class="card" id="collect"><h2 class="section-heading"><span class="count">01</span> Information we handle</h2><p>Depending on the features you use and the permissions you grant, SAMUDRAJ may handle the following categories of information:</p><div class="mini-grid"><div class="mini"><h3>Account details</h3><p>Information such as your name, email address, phone number and account identifier that you provide or that your sign-in provider makes available.</p></div><div class="mini"><h3>Addresses & delivery</h3><p>Saved delivery addresses, address labels, contact details, delivery instructions and selected delivery preferences.</p></div><div class="mini"><h3>Cart, orders & schedules</h3><p>Products, quantities, variants where applicable, order history, scheduled-delivery configuration, package choice, delivery time and order status.</p></div><div class="mini"><h3>Payment references</h3><p>Payment status, amount, payment method and transaction identifiers needed to associate a payment with an order or schedule.</p></div><div class="mini"><h3>Location, when permitted</h3><p>Your device location may be used when you choose a location-based feature, for example to help select or set a delivery location.</p></div><div class="mini"><h3>Device & notifications</h3><p>Technical information needed to operate the app and push-notification token data when notifications are enabled or registered.</p></div></div><p>We do not ask you to send passwords, UPI PINs, card PINs or card CVVs to customer support.</p></section>
<section class="card" id="location"><h2 class="section-heading"><span class="count">02</span> Location permission</h2><p>If you grant location permission and use a feature that needs it, the app may access your device location to help identify a delivery area or prefill location-related details. You can manage location permission in your device settings. Some location-assisted features may not work without it; you can still enter an address manually where the app supports that option.</p><p>We do not describe background location tracking as a required feature of this policy. If the app's actual permissions or implementation change, this policy and the Play Console declarations should be updated accordingly.</p></section>
<section class="card" id="use"><h2 class="section-heading"><span class="count">03</span> How we use information</h2><ul><li>Create and manage your account and sign-in session.</li><li>Display the product catalogue and maintain your cart and saved preferences.</li><li>Calculate applicable totals and arrange express or scheduled deliveries.</li><li>Create and track orders, schedules, payment status and customer requests.</li><li>Send service-related notifications, order updates and relevant support responses.</li><li>Detect errors, prevent fraud or misuse, maintain app security and meet legal obligations.</li></ul><p>We aim to use information only for purposes relevant to operating SAMUDRAJ and supporting customers.</p></section>
<section class="card" id="share"><h2 class="section-heading"><span class="count">04</span> When information is shared</h2><p>Information may be processed by service providers where needed to operate the app. Based on the features used, these may include:</p><ul><li><strong>Supabase:</strong> backend services for account-related app data, addresses, carts, orders and schedules.</li><li><strong>Firebase / Google services:</strong> app infrastructure and push notifications, where enabled and configured in the app.</li><li><strong>Razorpay:</strong> payment checkout and transaction processing. Payment details entered into Razorpay checkout are handled under the payment provider's own terms and privacy practices.</li><li><strong>Delivery and support operations:</strong> only the details needed to deliver an order or respond to a request.</li></ul><p>We do not sell personal information as a business model. Information may also be disclosed when required by law, to protect users or the service, or as part of a legitimate business transition with appropriate safeguards.</p></section>
<section class="card" id="payments"><h2 class="section-heading"><span class="count">05</span> Payments</h2><p>Payments are initiated through the payment checkout integrated into SAMUDRAJ. We may receive payment status, transaction identifiers, the amount and other limited details needed to confirm and reconcile a transaction with the correct order or schedule.</p><p>SAMUDRAJ does not ask customers to share UPI PINs, banking passwords, card PINs or CVVs through support messages. Do not send those credentials to us.</p></section>
<section class="card" id="retention"><h2 class="section-heading"><span class="count">06</span> Security and retention</h2><p>We use reasonable technical and organisational safeguards designed to protect information. No internet-based service can guarantee absolute security.</p><p>We retain information for as long as reasonably needed to operate the account, fulfil orders and scheduled deliveries, provide customer support, resolve disputes, maintain business and accounting records, prevent fraud, and meet legal obligations. Some order or transaction records may need to be retained after an account-deletion request for these purposes.</p></section>
<section class="card" id="choices"><h2 class="section-heading"><span class="count">07</span> Your choices and rights</h2><p>You can review the information available through the app, update supported profile or address details, manage device permissions and notification preferences, and contact us with privacy questions or requests relating to your personal information. Depending on applicable law, you may have additional rights regarding access, correction, deletion or processing of your information.</p></section>
<section class="card" id="deletion"><h2 class="section-heading"><span class="count">08</span> Account and data deletion</h2><p>You can submit an external account-deletion request using the page below or email SAMUDRAJ Support. We may ask for reasonable information to verify account ownership. After verification, requests will be handled subject to applicable legal, accounting, security and dispute-related retention requirements.</p><p>This page is a request channel; it does not automatically delete an account when you open it. SAMUDRAJ must review and fulfil valid requests through its account-management process.</p><a class="btn btn-secondary" href="delete-account.html">View account deletion options <span aria-hidden="true">→</span></a></section>
<section class="card" id="children"><h2 class="section-heading"><span class="count">09</span> Children's privacy</h2><p>SAMUDRAJ is a general shopping service and is not designed specifically for children. If you believe a child has provided personal information inappropriately, contact us so we can review the request and take appropriate action under applicable law.</p></section>
<section class="card" id="changes"><h2 class="section-heading"><span class="count">10</span> Changes to this policy</h2><p>We may update this policy when our app, data practices or legal obligations change. We will publish the updated policy on this page and revise the “Last updated” date. Please review this page periodically.</p></section>
<section class="card contact-card" id="contact"><h2 class="section-heading"><span class="count">11</span> Contact SAMUDRAJ</h2><p>For privacy questions, customer support or account-deletion requests, contact:</p><p><strong>Business / app name:</strong> SAMUDRAJ<br><strong>Email:</strong> <a class="email" href="mailto:samudraj.support@gmail.com?subject=SAMUDRAJ%20Privacy%20Enquiry">samudraj.support@gmail.com</a></p><div class="button-row"><a class="btn btn-primary" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=samudraj.support%40gmail.com&amp;su=SAMUDRAJ%20Privacy%20Enquiry&amp;body=Hello%20SAMUDRAJ%20Support%2C%0A%0AMy%20enquiry%20is%3A%0A" target="_blank" rel="noopener noreferrer">Open Gmail to contact us ↗</a><a class="btn btn-secondary" href="delete-account.html">Account deletion</a></div><p><small>If Gmail is not signed in on your device, you can sign in to your Google account or copy the email address above.</small></p></section>
